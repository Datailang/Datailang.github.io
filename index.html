<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlossBot — AI Assistant</title>
  <link id="app-favicon" rel="icon">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['Fira Code', 'monospace'],
          },
        }
      }
    }
  </script>

  <style type="text/tailwindcss">
    @layer base {
      :root {
        --accent: #8B5CF6;
        --accent2: #6366F1;
        --border: rgba(139, 92, 246, 0.15);
        --surface: rgba(12, 12, 22, 0.88);
        --font-mono: 'Fira Code', monospace;
      }
      body {
        @apply bg-[#0F0F13] text-gray-200 font-sans overflow-hidden antialiased;
        margin: 0; padding: 0;
      }
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.2); border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(139, 92, 246, 0.45); }
      input, textarea, button { outline: none; }
    }

    @layer components {
      .glass-panel {
        background: var(--surface);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid var(--border);
        box-shadow: 0 0 80px rgba(139, 92, 246, 0.05), 0 25px 60px rgba(0, 0, 0, 0.6);
      }

      .btn-primary {
        @apply flex items-center justify-center px-5 py-2.5 rounded-xl font-medium text-sm transition-all duration-200 cursor-pointer;
        background: rgba(139, 92, 246, 0.1);
        border: 1px solid rgba(139, 92, 246, 0.35);
        color: #c4b5fd;
      }
      .btn-primary:hover:not(:disabled) {
        background: linear-gradient(135deg, #8B5CF6, #6366F1);
        color: white;
        border-color: transparent;
        box-shadow: 0 0 24px rgba(139, 92, 246, 0.4);
      }
      .btn-primary:disabled { opacity: 0.3; pointer-events: none; }

      .btn-danger {
        @apply flex items-center justify-center px-5 py-2.5 rounded-xl font-medium text-sm transition-all duration-200 cursor-pointer;
        background: rgba(239, 68, 68, 0.08);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #fca5a5;
      }
      .btn-danger:hover:not(:disabled) {
        background: rgba(239, 68, 68, 0.2);
        box-shadow: 0 0 20px rgba(239, 68, 68, 0.2);
      }
      .btn-danger:disabled { opacity: 0.3; pointer-events: none; }

      .input-element {
        @apply rounded-xl px-4 py-3 text-sm transition-all duration-200 font-sans;
        background: rgba(10, 10, 20, 0.7);
        border: 1px solid rgba(139, 92, 246, 0.2);
        color: #e2e8f0;
      }
      .input-element::placeholder { color: rgba(148, 163, 184, 0.3); }
      .input-element:focus {
        border-color: rgba(139, 92, 246, 0.5);
        background: rgba(139, 92, 246, 0.04);
        box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.08);
      }

      .msg-row { @apply flex gap-3 mb-5 w-full; animation: slideUp 0.22s ease-out; }
      .msg-row.user { @apply flex-row-reverse; }

      .bubble-avatar {
        @apply w-9 h-9 flex flex-shrink-0 items-center justify-center rounded-full;
      }
      .msg-row.ai .bubble-avatar {
        background: linear-gradient(135deg, rgba(139,92,246,0.22), rgba(99,102,241,0.22));
        border: 1px solid rgba(139, 92, 246, 0.3);
        color: #a78bfa;
      }

      .bubble { @apply flex flex-col max-w-[78%]; }
      .msg-row.user .bubble { @apply items-end; }

      .bubble-text {
        @apply px-4 py-3 text-sm leading-relaxed rounded-2xl;
        font-family: 'Inter', sans-serif;
        line-height: 1.65;
      }
      .msg-row.ai .bubble-text {
        background: rgba(139, 92, 246, 0.07);
        border: 1px solid rgba(139, 92, 246, 0.12);
        color: #e2e8f0;
        border-top-left-radius: 5px;
      }
      .msg-row.user .bubble-text {
        background: rgba(99, 102, 241, 0.12);
        border: 1px solid rgba(99, 102, 241, 0.2);
        color: #f1f5f9;
        border-top-right-radius: 5px;
      }

      .bubble-time { @apply text-[10px] mt-1.5 font-mono; color: rgba(139, 92, 246, 0.35); }

      .typing-dots { @apply flex gap-1.5 py-0.5; }
      .typing-dots span { @apply w-2 h-2 rounded-full; background: #8B5CF6; animation: blink 1.2s infinite; }
      .typing-dots span:nth-child(2) { animation-delay: 0.25s; }
      .typing-dots span:nth-child(3) { animation-delay: 0.5s; }

      .admin-msg-row { @apply flex gap-3 mb-5; animation: slideUp 0.22s ease-out; }
      .admin-msg-row.from-admin { @apply flex-row-reverse; }

      .admin-avatar {
        @apply w-9 h-9 flex flex-shrink-0 items-center justify-center rounded-full text-sm font-medium;
      }
      .admin-avatar.operator {
        background: linear-gradient(135deg, rgba(139,92,246,0.22), rgba(99,102,241,0.22));
        border: 1px solid rgba(139, 92, 246, 0.3);
        color: #a78bfa;
      }
      .admin-avatar.visitor {
        background: rgba(100, 100, 120, 0.12);
        border: 1px solid rgba(148, 163, 184, 0.18);
        color: #94a3b8;
      }

      .admin-bubble-wrap { @apply flex flex-col max-w-[76%]; }
      .admin-msg-row.from-admin .admin-bubble-wrap { @apply items-end; }

      .admin-bubble-text {
        @apply px-4 py-3 text-sm leading-relaxed rounded-2xl;
        font-family: 'Inter', sans-serif;
      }
      .admin-msg-row.from-admin .admin-bubble-text {
        background: rgba(139, 92, 246, 0.08);
        border: 1px solid rgba(139, 92, 246, 0.15);
        color: #e2e8f0;
        border-top-right-radius: 4px;
      }
      .admin-msg-row.from-visitor .admin-bubble-text {
        background: rgba(100, 100, 140, 0.08);
        border: 1px solid rgba(148, 163, 184, 0.12);
        color: #cbd5e1;
        border-top-left-radius: 4px;
      }

      .admin-bubble-meta { @apply text-[10px] text-slate-600 mb-1.5 font-mono tracking-wide; }

      .sys-event {
        @apply flex items-center justify-center gap-3 text-[10px] text-slate-600 font-mono tracking-widest my-5;
      }
      .sys-event::before, .sys-event::after {
        content: '';
        @apply h-px flex-1;
        background: rgba(139, 92, 246, 0.1);
      }

      .ws-toggle {
        @apply relative cursor-pointer transition-all duration-300;
        width: 42px; height: 22px;
        background: rgba(30, 30, 50, 0.8);
        border: 1px solid rgba(139, 92, 246, 0.25);
        border-radius: 11px;
      }
      .ws-toggle.on {
        background: rgba(139, 92, 246, 0.18);
        border-color: rgba(139, 92, 246, 0.55);
        box-shadow: 0 0 10px rgba(139, 92, 246, 0.15);
      }
      .ws-toggle .ws-knob {
        @apply absolute top-[3px] left-[3px] transition-all duration-300;
        width: 14px; height: 14px;
        background: #475569;
        border-radius: 50%;
      }
      .ws-toggle.on .ws-knob {
        background: #8B5CF6;
        transform: translateX(20px);
      }

      .conn-banner {
        @apply py-2 px-4 text-center text-xs font-medium tracking-wide z-[99];
        background: rgba(220, 38, 38, 0.85);
        color: white;
      }

      .robot-icon { @apply block w-6 h-6; }
      .robot-icon-sm { @apply w-5 h-5; }
      .robot-icon-lg { @apply w-9 h-9; }
      .mode-btn-content { @apply inline-flex items-center justify-center gap-2 whitespace-nowrap; }
      .status-dot { @apply w-2 h-2 rounded-full; }
      .status-dot.connected { background: #22c55e; box-shadow: 0 0 7px rgba(34,197,94,0.8); }
      .status-dot.disconnected { background: #ef4444; box-shadow: 0 0 7px rgba(239,68,68,0.8); }

      /* Markdown prose */
      .prose-content { font-family: 'Inter', sans-serif; word-break: break-word; }
      .prose-content p { margin: 0 0 0.65em; }
      .prose-content p:last-child { margin-bottom: 0; }
      .prose-content strong { font-weight: 600; color: #f1f5f9; }
      .prose-content em { font-style: italic; color: #cbd5e1; }
      .prose-content code {
        font-family: 'Fira Code', monospace;
        font-size: 0.84em;
        background: rgba(139, 92, 246, 0.12);
        border: 1px solid rgba(139, 92, 246, 0.2);
        border-radius: 5px;
        padding: 0.1em 0.4em;
        color: #c4b5fd;
      }
      .prose-content pre {
        background: #0d0d1a;
        border: 1px solid rgba(139, 92, 246, 0.14);
        border-radius: 10px;
        overflow: hidden;
        margin: 0.65em 0;
      }
      .prose-content pre code {
        background: transparent !important;
        border: none !important;
        border-radius: 0;
        padding: 0.9em 1.1em;
        display: block;
        font-size: 0.8rem;
        line-height: 1.7;
        color: #e2e8f0;
        overflow-x: auto;
      }
      .prose-content ul, .prose-content ol { padding-left: 1.4em; margin: 0.4em 0; }
      .prose-content li { margin: 0.2em 0; }
      .prose-content ul li { list-style-type: disc; }
      .prose-content ol li { list-style-type: decimal; }
      .prose-content a { color: #a78bfa; text-decoration: underline; text-underline-offset: 2px; }
      .prose-content a:hover { color: #c4b5fd; }
      .prose-content h1, .prose-content h2, .prose-content h3 {
        font-weight: 600; margin: 0.9em 0 0.4em; color: #f1f5f9;
      }
      .prose-content h1 { font-size: 1.2em; }
      .prose-content h2 { font-size: 1.08em; }
      .prose-content h3 { font-size: 1em; }
      .prose-content blockquote {
        border-left: 3px solid rgba(139, 92, 246, 0.45);
        padding-left: 0.9em;
        color: #94a3b8;
        margin: 0.65em 0;
        font-style: italic;
      }
      .prose-content hr { border: none; border-top: 1px solid rgba(139,92,246,0.12); margin: 0.9em 0; }
      .prose-content table { border-collapse: collapse; width: 100%; margin: 0.65em 0; font-size: 0.875em; }
      .prose-content th, .prose-content td { padding: 0.45em 0.7em; border: 1px solid rgba(139,92,246,0.12); }
      .prose-content th { background: rgba(139,92,246,0.07); font-weight: 600; }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes blink { 0%, 100% { opacity: 0.15; } 50% { opacity: 1; } }
  </style>
</head>
<body>

  <div id="vanta-bg" class="fixed inset-0 z-[-1]"></div>

  <!-- LOGIN VIEW -->
  <div id="login-view" class="hidden w-screen h-screen items-center justify-center p-4">
    <div class="glass-panel w-full max-w-[400px] p-10 flex flex-col rounded-2xl">
      <div class="text-center mb-10">
        <div class="w-14 h-14 mx-auto mb-5 rounded-2xl flex items-center justify-center" style="background: linear-gradient(135deg, rgba(139,92,246,0.2), rgba(99,102,241,0.2)); border: 1px solid rgba(139,92,246,0.3);">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="1.5">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h1 class="text-xl font-semibold text-white mb-1.5 tracking-tight">管理员登录</h1>
        <p class="text-xs text-slate-500">FlossBot 运营控制台</p>
      </div>

      <div class="flex flex-col gap-3">
        <input id="login-pwd" type="password" class="input-element text-center tracking-[0.3em] text-base py-3.5" placeholder="输入访问密码" autocomplete="off" />
        <button id="login-btn" class="btn-primary py-3 mt-1 w-full justify-center" onclick="doLogin()">进入控制台</button>
        <div id="login-error" class="text-red-400 text-xs text-center min-h-[18px] font-medium mt-0.5"></div>
      </div>
    </div>
  </div>

  <!-- VISITOR VIEW -->
  <div id="visitor-view" class="hidden w-screen h-screen items-center justify-center p-4 lg:p-8">
    <div class="glass-panel w-full max-w-[800px] h-full max-h-[740px] flex flex-col relative rounded-2xl overflow-hidden">
      <div id="conn-banner" class="conn-banner hidden w-full">连接已断开，正在重新连接...</div>

      <!-- Header -->
      <div class="flex items-center justify-between px-5 py-4 shrink-0" style="border-bottom: 1px solid rgba(139,92,246,0.1); background: rgba(0,0,0,0.3);">
        <div class="flex items-center gap-3.5">
          <div id="bot-avatar-icon" class="w-10 h-10 flex items-center justify-center rounded-xl shrink-0" style="background: linear-gradient(135deg, rgba(139,92,246,0.2), rgba(99,102,241,0.2)); border: 1px solid rgba(139,92,246,0.28);"></div>
          <div>
            <h1 class="text-base font-semibold text-white tracking-tight">FlossBot</h1>
            <div class="flex items-center gap-1.5 mt-0.5">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse" style="box-shadow: 0 0 5px rgba(52,211,153,0.8);"></span>
              <span class="text-xs text-slate-500">在线</span>
            </div>
          </div>
        </div>
        <div class="hidden md:flex items-center gap-1.5 text-[11px] text-slate-600 font-mono">
          <span>v2.0.4</span>
        </div>
      </div>

      <!-- Messages Area -->
      <div id="msg-area" class="flex-1 overflow-y-auto px-5 py-5" style="background: rgba(0,0,0,0.12);"></div>

      <!-- Web Search Toggle -->
      <div id="websearch-bar" class="flex items-center justify-between gap-4 px-5 py-2.5 shrink-0" style="border-top: 1px solid rgba(139,92,246,0.08); background: rgba(0,0,0,0.35);">
        <div class="flex items-center gap-2 text-[11px] text-slate-600">
          <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
          <span class="font-medium">联网搜索</span>
        </div>
        <div class="flex items-center gap-2.5 shrink-0">
          <button id="ws-toggle" class="ws-toggle" aria-label="Toggle network search" type="button">
            <span class="ws-knob"></span>
          </button>
          <span id="ws-label" class="min-w-[2rem] text-right font-mono text-[11px] text-slate-600">关闭</span>
        </div>
      </div>

      <!-- Input Area -->
      <div class="px-5 py-4 shrink-0" style="border-top: 1px solid rgba(139,92,246,0.12); background: rgba(0,0,0,0.45);">
        <div class="flex gap-3 items-end">
          <textarea id="visitor-input" class="input-element flex-1 min-h-[48px] max-h-[130px] resize-none" placeholder="向 FlossBot 发送消息... (Enter 发送，Shift+Enter 换行)" rows="1"></textarea>
          <button id="send-btn" class="btn-primary w-11 h-11 shrink-0 p-0 rounded-xl" disabled>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ADMIN VIEW -->
  <div id="admin-view" class="hidden w-screen h-screen flex-col overflow-hidden relative z-10" style="background: rgba(8,8,16,0.95);">
    <!-- Top Bar -->
    <header class="flex items-center justify-between px-6 py-3.5 shrink-0" style="border-bottom: 1px solid rgba(139,92,246,0.12); background: rgba(0,0,0,0.65);">
      <div class="flex items-center gap-5">
        <div class="text-base font-semibold text-white tracking-tight">FlossBot <span class="text-slate-600 font-normal text-sm ml-1">控制台</span></div>
        <div id="admin-status" class="flex items-center gap-2 px-3 py-1.5 rounded-lg hidden sm:flex" style="background: rgba(12,12,24,0.8); border: 1px solid rgba(139,92,246,0.12);">
          <span id="status-dot" class="status-dot disconnected"></span>
          <span id="status-text" class="text-[11px] font-mono text-slate-500 tracking-wide">连接中...</span>
        </div>
      </div>
      <button class="btn-primary px-4 py-2 text-xs hidden sm:flex" onclick="switchToVisitor()">访客视图</button>
    </header>

    <!-- Main Body -->
    <div class="flex flex-1 overflow-hidden">
      <!-- Sidebar -->
      <aside class="w-64 flex flex-col shrink-0" style="border-right: 1px solid rgba(139,92,246,0.1); background: rgba(0,0,0,0.35);">
        <div class="p-5 text-center" style="border-bottom: 1px solid rgba(139,92,246,0.08);">
          <p class="text-[10px] font-mono font-medium text-slate-600 tracking-widest mb-2.5 uppercase">在线访客</p>
          <div id="visitor-count" class="text-5xl font-bold text-white" style="text-shadow: 0 0 30px rgba(139,92,246,0.35)">0</div>
        </div>
        <div class="flex-1 flex flex-col overflow-hidden">
          <h3 class="text-[10px] font-mono font-medium text-slate-600 tracking-widest px-4 py-2.5 uppercase shrink-0" style="border-bottom: 1px solid rgba(139,92,246,0.07);">活跃会话</h3>
          <div id="visitor-list" class="flex-1 overflow-y-auto p-2 space-y-1"></div>
        </div>
      </aside>

      <!-- Main Chat Panel -->
      <main class="flex-1 flex flex-col relative w-full overflow-hidden">
        <!-- Toolbar -->
        <div class="flex flex-wrap items-center justify-between px-5 py-3 shrink-0 gap-3" style="border-bottom: 1px solid rgba(139,92,246,0.1); background: rgba(0,0,0,0.45);">
          <div class="text-xs font-mono text-slate-500 flex items-center gap-2">
            <span>当前会话:</span>
            <span id="active-visitor-label" class="text-purple-300 font-medium px-2.5 py-1 rounded-lg" style="background: rgba(139,92,246,0.1); border: 1px solid rgba(139,92,246,0.22);">未选择</span>
          </div>
          <div class="flex items-center gap-3">
            <button id="mode-btn" class="btn-primary px-4 py-2 text-xs" onclick="toggleMode()">AI AUTO [ON]</button>
            <button class="btn-danger px-4 py-2 text-xs" onclick="clearHistory()">清空记录</button>
          </div>
        </div>

        <!-- Messages Area -->
        <div id="admin-msg-area" class="flex-1 overflow-y-auto px-6 py-5 scroll-smooth">
          <div id="empty-state" class="flex flex-col items-center justify-center h-full gap-3 opacity-25">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#8B5CF6" stroke-width="1"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>
            <div class="text-sm font-medium text-slate-500 tracking-wide">等待会话消息</div>
          </div>
        </div>

        <!-- Admin Reply -->
        <div class="px-5 py-4 shrink-0" style="border-top: 1px solid rgba(139,92,246,0.12); background: rgba(0,0,0,0.55);">
          <div class="flex items-center justify-between mb-2.5">
            <span class="text-xs font-medium text-slate-600 tracking-wide">手动回复</span>
            <span id="typing-hint" class="text-[11px] font-mono text-purple-400 animate-pulse hidden">访客正在等待...</span>
          </div>
          <div class="flex flex-col sm:flex-row gap-3">
            <textarea id="admin-input" class="input-element flex-1 min-h-[68px] max-h-[160px] resize-none" placeholder="输入回复内容 (Enter 发送，Shift+Enter 换行)..." rows="2"></textarea>
            <button id="admin-send-btn" class="btn-primary w-full sm:w-24 sm:h-auto shrink-0 py-3 sm:py-0" disabled>发送</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script>
  window.addEventListener('DOMContentLoaded', () => {
    if (window.marked) {
      marked.setOptions({ breaks: true, gfm: true });
    }
    try {
      if (window.VANTA) {
        window.VANTA.NET({
          el: "#vanta-bg",
          mouseControls: true, touchControls: true, gyroControls: false,
          minHeight: 200.0, minWidth: 200.0, scale: 1.0, scaleMobile: 1.0,
          color: 0x8B5CF6, backgroundColor: 0x0F0F13,
          points: 8.0, maxDistance: 22.0, spacing: 24.0
        });
      }
    } catch(e) {}
  });
  </script>

  <script>
// ── 配置 ─────────────────────────────────────────────────
const WS_URL  = "wss://qvsrnjkbmkon.sealoshzh.site";

const uid  = () => Math.random().toString(36).slice(2,9);
const time = () => new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"});
const isAdmin = () => location.hash === "#admin";
const ROBOT_ICON_SHAPES = `
  <rect x="12" y="14" width="40" height="34" rx="11" fill="#ec4899"></rect>
  <rect x="12" y="14" width="40" height="34" rx="11" fill="#8b5cf6" opacity="0.45"></rect>
  <rect x="29" y="7" width="6" height="8" rx="3" fill="#fbcfe8"></rect>
  <circle cx="23" cy="30" r="4.2" fill="#fff"></circle>
  <circle cx="41" cy="30" r="4.2" fill="#fff"></circle>
  <rect x="23" y="39" width="18" height="4" rx="2" fill="#18181b"></rect>
`;
const robotIconMarkup = (className = "robot-icon") => `
  <svg class="${className}" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
    ${ROBOT_ICON_SHAPES}
  </svg>`;
const aiModeBtnHtml = () => `<span class="mode-btn-content">${robotIconMarkup("robot-icon robot-icon-sm")}AI AUTO</span>`;
function initRobotAssets() {
  const favicon = document.getElementById("app-favicon");
  if (favicon) {
    const faviconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">${ROBOT_ICON_SHAPES}</svg>`;
    favicon.href = `data:image/svg+xml,${encodeURIComponent(faviconSvg)}`;
  }
  const botAvatarIcon = document.getElementById("bot-avatar-icon");
  if (botAvatarIcon) botAvatarIcon.innerHTML = robotIconMarkup("robot-icon robot-icon-lg");
  const modeBtn = document.getElementById("mode-btn");
  if (modeBtn) modeBtn.innerHTML = aiModeBtnHtml();
}

// ── 视图切换 ─────────────────────────────────────────────
function showView(id, display = "flex") {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.remove("hidden", "show");
  el.style.display = display;
}
function hideView(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.style.display = "none";
}

let loginKeyBound = false;
let visitorInited = false;
let adminInited   = false;

function render() {
  if (isAdmin()) {
    if (sessionStorage.getItem("flossbot_auth") && _adminPwd) {
      showAdminView();
    } else {
      sessionStorage.removeItem("flossbot_auth");
      showLoginView();
    }
  } else {
    hideView("login-view");
    hideView("admin-view");
    showView("visitor-view", "flex");
    initVisitor();
  }
}

function showLoginView() {
  showView("login-view", "flex");
  hideView("visitor-view");
  hideView("admin-view");
  setTimeout(() => document.getElementById("login-pwd")?.focus(), 100);
  if (!loginKeyBound) {
    loginKeyBound = true;
    document.getElementById("login-pwd")?.addEventListener("keydown", (e) => {
      if (e.key === "Enter") doLogin();
    });
  }
}
function showAdminView() {
  hideView("login-view");
  hideView("visitor-view");
  showView("admin-view", "flex");
  initAdmin();
}

window.addEventListener("hashchange", () => location.reload());
function switchToVisitor() { location.hash = ""; }

let loginWs = null;

// ══════════════════════════════════════════════════════════
//  VISITOR
// ══════════════════════════════════════════════════════════
let visitorWs = null;
let webSearchEnabled = false;

function toggleWebSearch() {
  webSearchEnabled = !webSearchEnabled;
  const toggle = document.getElementById("ws-toggle");
  const label  = document.getElementById("ws-label");
  if (webSearchEnabled) {
    toggle.classList.add("on");
    toggle.setAttribute("aria-pressed", "true");
    label.textContent = "开启";
  } else {
    toggle.classList.remove("on");
    toggle.setAttribute("aria-pressed", "false");
    label.textContent = "关闭";
  }
  if (visitorWs && visitorWs.readyState === 1) {
    visitorWs.send(JSON.stringify({ type: "TOGGLE_WEBSEARCH", payload: { enabled: webSearchEnabled } }));
  }
}

function initVisitor() {
  if (visitorInited) return;
  visitorInited = true;
  appendAIMsg("你好！我是 FlossBot，有什么可以帮你的吗？✨");
  connectVisitor();
  const input    = document.getElementById("visitor-input");
  const sendBtn  = document.getElementById("send-btn");
  const wsToggle = document.getElementById("ws-toggle");
  wsToggle.addEventListener("click", toggleWebSearch);
  input.addEventListener("input", () => {
    sendBtn.disabled = !input.value.trim();
    input.style.height = "auto";
    input.style.height = input.scrollHeight + "px";
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendVisitorMsg(); }
  });
  sendBtn.addEventListener("click", sendVisitorMsg);
}

function connectVisitor() {
  visitorWs = new WebSocket(`${WS_URL}?role=visitor`);
  visitorWs.onopen = () => {
    document.getElementById("send-btn").disabled = false;
    document.getElementById("conn-banner")?.classList.add("hidden");
  };
  visitorWs.onmessage = (e) => {
    const { type, payload } = JSON.parse(e.data);
    if (type === "OPERATOR_TYPING") { payload ? showTyping() : hideTyping(); }
    if (type === "OPERATOR_REPLY")  { hideTyping(); appendAIMsg(payload.text); }
  };
  visitorWs.onclose = () => {
    document.getElementById("send-btn").disabled = true;
    document.getElementById("conn-banner")?.classList.remove("hidden");
    setTimeout(connectVisitor, 3000);
  };
  visitorWs.onerror = () => visitorWs.close();
}

function sendVisitorMsg() {
  const input = document.getElementById("visitor-input");
  const text  = input.value.trim();
  if (!text || !visitorWs || visitorWs.readyState !== 1) return;
  const msg = { id: uid(), role: "user", text, time: time() };
  appendUserMsg(text);
  visitorWs.send(JSON.stringify({ type: "USER_MESSAGE", payload: msg }));
  input.value = "";
  input.style.height = "auto";
  document.getElementById("send-btn").disabled = true;
}

let typingEl = null;
function showTyping() {
  if (typingEl) return;
  const area = document.getElementById("msg-area");
  typingEl = document.createElement("div");
  typingEl.className = "msg-row ai";
  typingEl.innerHTML = `
    <div class="bubble-avatar">${robotIconMarkup("robot-icon robot-icon-sm")}</div>
    <div class="bubble">
      <div class="bubble-text">
        <div class="typing-dots"><span></span><span></span><span></span></div>
      </div>
    </div>`;
  area.appendChild(typingEl);
  scrollBottom();
}
function hideTyping() {
  if (typingEl) { typingEl.remove(); typingEl = null; }
}

function renderMarkdown(text) {
  if (window.marked) {
    try { return marked.parse(text); } catch(e) {}
  }
  return escHtml(text);
}

function appendAIMsg(text) {
  hideTyping();
  const area = document.getElementById("msg-area");
  const row  = document.createElement("div");
  row.className = "msg-row ai";
  row.innerHTML = `
    <div class="bubble-avatar">${robotIconMarkup("robot-icon robot-icon-sm")}</div>
    <div class="bubble">
      <div class="bubble-text prose-content">${renderMarkdown(text)}</div>
      <div class="bubble-time">${time()}</div>
    </div>`;
  area.appendChild(row);
  if (window.hljs) {
    row.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
  }
  scrollBottom();
}

function appendUserMsg(text) {
  const area = document.getElementById("msg-area");
  const row  = document.createElement("div");
  row.className = "msg-row user";
  row.innerHTML = `
    <div class="bubble" style="align-items:flex-end">
      <div class="bubble-text">${escHtml(text)}</div>
      <div class="bubble-time">${time()}</div>
    </div>`;
  area.appendChild(row);
  scrollBottom();
}

function scrollBottom() {
  const area = document.getElementById("msg-area");
  setTimeout(() => area.scrollTop = area.scrollHeight, 50);
}

// ══════════════════════════════════════════════════════════
//  ADMIN
// ══════════════════════════════════════════════════════════
let adminWs      = null;
let isTypingSent = false;
let typingTimer  = null;

function toggleMode() { sendAdmin({ type: "TOGGLE_MODE" }); }
function selectVisitor(num) { sendAdmin({ type: "SELECT_VISITOR", payload: { num } }); }
function clearHistory() {
  if (!confirm("确定清空所有消息记录？此操作不可撤销。")) return;
  sendAdmin({ type: "CLEAR_HISTORY" });
}

function initAdmin() {
  if (adminInited) return;
  adminInited = true;
  connectAdmin();
  const input   = document.getElementById("admin-input");
  const sendBtn = document.getElementById("admin-send-btn");
  input.addEventListener("input", () => {
    sendBtn.disabled = !input.value.trim();
    if (!isTypingSent) {
      isTypingSent = true;
      sendAdmin({ type: "OPERATOR_TYPING", payload: true });
      document.getElementById("typing-hint").style.display = "inline";
    }
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => {
      isTypingSent = false;
      sendAdmin({ type: "OPERATOR_TYPING", payload: false });
      document.getElementById("typing-hint").style.display = "none";
    }, 1500);
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendAdminReply(); }
  });
  sendBtn.addEventListener("click", sendAdminReply);
}

function connectAdmin() {
  adminWs = new WebSocket(`${WS_URL}?role=admin`);
  adminWs.onopen = () => {
    if (_adminPwd) {
      adminWs.send(JSON.stringify({ type: "AUTH", payload: { password: _adminPwd } }));
    } else {
      sessionStorage.removeItem("flossbot_auth");
      location.reload();
    }
  };
  adminWs.onmessage = (e) => {
    const { type, payload } = JSON.parse(e.data);
    if (type === "AUTH_SUCCESS") { setAdminStatus(true); return; }
    if (type === "AUTH_FAIL") { sessionStorage.removeItem("flossbot_auth"); location.reload(); return; }
    if (type === "SERVER_INFO") {
      document.getElementById("visitor-count").textContent = payload.visitors;
      updateModeBtn(payload.aiMode);
      updateVisitorList(payload.visitorList || []);
      updateActiveLabel(payload.activeVisitorNum);
      if (payload.history && payload.history.length > 0) {
        document.getElementById("empty-state")?.remove();
        payload.history.forEach(msg => {
          appendAdminMsg(msg.role, msg.text, msg.time, msg.num ? `访客${msg.num}` : null);
        });
        appendSysEvent("── 以上为历史消息 ──");
      }
    }
    if (type === "VISITOR_JOINED") {
      document.getElementById("visitor-count").textContent = payload.count;
      updateVisitorList(payload.list || []);
      appendSysEvent(`访客${payload.num} 已连接（在线: ${payload.count}）`);
    }
    if (type === "VISITOR_LEFT") {
      document.getElementById("visitor-count").textContent = payload.count;
      updateVisitorList(payload.list || []);
      updateActiveLabel(payload.activeVisitorNum);
      appendSysEvent(`访客${payload.num} 已离开（在线: ${payload.count}）`);
    }
    if (type === "VISITOR_LIST") { updateVisitorList(payload.list || []); }
    if (type === "USER_MESSAGE") {
      document.getElementById("empty-state")?.remove();
      appendAdminMsg("visitor", payload.text, payload.time, `访客${payload.visitorNum}`);
    }
    if (type === "MODE_CHANGE") {
      updateModeBtn(payload.aiMode);
      appendSysEvent(payload.aiMode ? "已切换为 AI 自动模式" : "已切换为 人工接管模式");
    }
    if (type === "AI_REPLY") {
      const prefix = payload.webSearch ? "联网 AI" : "AI";
      appendAdminMsg("operator", `${prefix} ${payload.text}`, time(), `→ 访客${payload.visitorNum}`);
    }
    if (type === "ACTIVE_VISITOR_CHANGED") { updateActiveLabel(payload.num); }
    if (type === "VISITOR_WEBSEARCH_CHANGED") {
      const v = cachedVisitorList.find(v => v.num === payload.num);
      if (v) v.webSearch = payload.webSearch;
      updateVisitorList(null);
      appendSysEvent(`访客${payload.num} ${payload.webSearch ? "🌐 开启了联网搜索" : "关闭了联网搜索"}`);
    }
    if (type === "HISTORY_CLEARED") {
      document.getElementById("admin-msg-area").innerHTML =
        `<div id="empty-state" class="flex flex-col items-center justify-center h-full gap-3 opacity-25">
          <div class="text-2xl">🗑️</div>
          <div class="text-sm font-medium text-slate-500">消息记录已清空</div>
        </div>`;
      appendSysEvent("── 消息记录已清空 ──");
    }
    if (type === "SYS_MSG") { appendSysEvent(payload.text); }
  };
  adminWs.onclose = () => { setAdminStatus(false); setTimeout(connectAdmin, 3000); };
  adminWs.onerror = () => adminWs.close();
}

let cachedVisitorList = [];

function updateVisitorList(list) {
  if (list) cachedVisitorList = list;
  const el = document.getElementById("visitor-list");
  if (!el) return;
  if (cachedVisitorList.length === 0) {
    el.innerHTML = `<div style="font-size:11px;color:#475569;padding:10px 8px;font-family:var(--font-mono);">暂无访客</div>`;
    return;
  }
  el.innerHTML = cachedVisitorList.map(v => `
    <div onclick="selectVisitor(${v.num})" style="
      display:flex;align-items:center;gap:9px;
      padding:9px 11px;border-radius:9px;cursor:pointer;
      background:${v.active ? "rgba(139,92,246,0.08)" : "transparent"};
      border:1px solid ${v.active ? "rgba(139,92,246,0.35)" : "transparent"};
      transition:all .15s;font-size:12px;
    ">
      <span style="width:5px;height:5px;background:#8B5CF6;flex-shrink:0;border-radius:50%;box-shadow:0 0 5px rgba(139,92,246,0.7);"></span>
      <span style="color:${v.active ? "#c4b5fd" : "#e2e8f0"};font-family:var(--font-mono);">访客 ${v.num}</span>
      ${v.webSearch ? '<span style="font-size:10px;color:#8B5CF6;">NET</span>' : ''}
      ${v.active ? '<span style="font-size:10px;color:#a78bfa;margin-left:auto;font-family:var(--font-mono);">当前</span>' : ''}
    </div>
  `).join("");
}

function updateActiveLabel(num) {
  const el = document.getElementById("active-visitor-label");
  if (el) el.textContent = num ? `访客 ${num}` : "未选择";
}

function updateModeBtn(aiMode) {
  const btn = document.getElementById("mode-btn");
  if (!btn) return;
  if (aiMode) {
    btn.innerHTML = aiModeBtnHtml();
    btn.style.background = "rgba(139,92,246,0.1)";
    btn.style.color = "#c4b5fd";
    btn.style.borderColor = "rgba(139,92,246,0.35)";
  } else {
    btn.textContent = "人工接管中";
    btn.style.background = "rgba(239,68,68,0.1)";
    btn.style.color = "#fca5a5";
    btn.style.borderColor = "rgba(239,68,68,0.35)";
  }
}

function sendAdmin(data) {
  if (adminWs && adminWs.readyState === 1) adminWs.send(JSON.stringify(data));
}

function sendAdminReply() {
  const input = document.getElementById("admin-input");
  const text  = input.value.trim();
  if (!text) return;
  clearTimeout(typingTimer);
  isTypingSent = false;
  sendAdmin({ type: "OPERATOR_TYPING", payload: false });
  sendAdmin({ type: "OPERATOR_REPLY", payload: { text } });
  document.getElementById("typing-hint").style.display = "none";
  appendAdminMsg("operator", text, time());
  input.value = "";
  document.getElementById("admin-send-btn").disabled = true;
  input.focus();
}

function appendAdminMsg(role, text, t, label) {
  const area = document.getElementById("admin-msg-area");
  const row  = document.createElement("div");
  const isOp = role === "operator";
  row.className = `admin-msg-row from-${isOp ? "admin" : "visitor"}`;
  row.innerHTML = `
    <div class="admin-avatar ${isOp ? "operator" : "visitor"}">${isOp ? robotIconMarkup("robot-icon robot-icon-sm") : "👤"}</div>
    <div class="admin-bubble-wrap">
      <div class="admin-bubble-meta">${label || (isOp ? "FlossBot（你）" : "访客")} · ${t || time()}</div>
      <div class="admin-bubble-text">${escHtml(text)}</div>
    </div>`;
  area.appendChild(row);
  area.scrollTop = area.scrollHeight;
}

function appendSysEvent(msg) {
  const area = document.getElementById("admin-msg-area");
  const el   = document.createElement("div");
  el.className = "sys-event";
  el.textContent = msg;
  area.appendChild(el);
  area.scrollTop = area.scrollHeight;
}

function setAdminStatus(connected) {
  document.getElementById("status-dot").className = `status-dot ${connected ? "connected" : "disconnected"}`;
  document.getElementById("status-text").textContent = connected ? "已连接" : "重连中…";
}

function escHtml(str) {
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>");
}

let _adminPwd = null;

function doLogin() {
  const pwd = document.getElementById("login-pwd").value.trim();
  if (!pwd) return;
  _adminPwd = pwd;
  const btn = document.getElementById("login-btn");
  const err = document.getElementById("login-error");
  btn.disabled = true;
  btn.textContent = "验证中…";
  err.textContent = "";

  loginWs = new WebSocket(`${WS_URL}?role=admin`);
  loginWs.onopen = () => {
    loginWs.send(JSON.stringify({ type: "AUTH", payload: { password: pwd } }));
  };
  loginWs.onmessage = (e) => {
    const { type } = JSON.parse(e.data);
    if (type === "AUTH_SUCCESS") {
      sessionStorage.setItem("flossbot_auth", "1");
      loginWs.close();
      showAdminView();
    }
    if (type === "AUTH_FAIL") {
      _adminPwd = null;
      btn.disabled = false;
      btn.textContent = "进入控制台";
      err.textContent = "密码错误，请重试";
      document.getElementById("login-pwd").value = "";
      document.getElementById("login-pwd").focus();
    }
  };
  loginWs.onerror = () => {
    btn.disabled = false;
    btn.textContent = "进入控制台";
    err.textContent = "服务器连接失败，请稍后重试";
  };
}

initRobotAssets();
render();
  </script>
</body>
